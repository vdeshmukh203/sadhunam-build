name: switch-canonical-source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/switch-canonical-source.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point build infrastructure at canonical Sadhunam repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          replacements = {
              "default: 'claude/browser-ui-merge-reconcile-2kwygj'": "default: 'main'",
              'SRC_REPO: vdeshmukh203/claude-plans': 'SRC_REPO: vdeshmukh203/Sadhunam',
              "SRC_REF: ${{ inputs.ref || 'claude/browser-ui-merge-reconcile-2kwygj' }}": "SRC_REF: ${{ inputs.ref || 'main' }}",
              'private/sadhunam/': 'private/',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'build.yml expected text missing: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          old = Path('.github/workflows/master-guard.yml')
          s = old.read_text()
          s = s.replace('vdeshmukh203/claude-plans', 'vdeshmukh203/Sadhunam')
          s = s.replace('sadhunam/src/', 'src/')
          s = s.replace('sadhunam/tests/', 'tests/')
          s = s.replace('find sadhunam ', 'find . ')
          s = s.replace('master', 'main')
          Path('.github/workflows/main-guard.yml').write_text(s)
          old.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml .github/workflows/main-guard.yml .github/workflows/master-guard.yml
          git diff --cached --check
          git commit -m 'Use canonical Sadhunam source repo'
          git push
