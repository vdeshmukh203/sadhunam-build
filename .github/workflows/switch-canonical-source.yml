name: switch-canonical-source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/switch-canonical-source.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point build infrastructure at canonical Sadhunam repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          if "default: 'claude/browser-ui-merge-reconcile-2kwygj'" not in s:
              raise SystemExit('build.yml old default ref missing')
          if 'SRC_REPO: vdeshmukh203/claude-plans' not in s:
              raise SystemExit('build.yml old source repo missing')
          if 'private/sadhunam/' not in s:
              raise SystemExit('build.yml old source layout missing')
          s = s.replace("default: 'claude/browser-ui-merge-reconcile-2kwygj'", "default: 'main'")
          s = s.replace('SRC_REPO: vdeshmukh203/claude-plans', 'SRC_REPO: vdeshmukh203/Sadhunam')
          expression = chr(36) + "{{ inputs.ref || 'main' }}"
          s, n = re.subn(r'(?m)^  SRC_REF:.*$', '  SRC_REF: ' + expression, s, count=1)
          if n != 1:
              raise SystemExit('build.yml SRC_REF line not found exactly once')
          s = s.replace('private/sadhunam/', 'private/')
          p.write_text(s)

          old = Path('.github/workflows/master-guard.yml')
          s = old.read_text()
          s = s.replace('vdeshmukh203/claude-plans', 'vdeshmukh203/Sadhunam')
          s = s.replace('sadhunam/src/', 'src/')
          s = s.replace('sadhunam/tests/', 'tests/')
          s = s.replace('find sadhunam ', 'find . ')
          s = s.replace('master', 'main')
          Path('.github/workflows/main-guard.yml').write_text(s)
          old.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml .github/workflows/main-guard.yml .github/workflows/master-guard.yml
          git diff --cached --check
          git commit -m 'Use canonical Sadhunam source repo'
          git push
