name: migrate-sadhunam-source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate-sadhunam.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source monorepo
        uses: actions/checkout@v4
        with:
          repository: vdeshmukh203/claude-plans
          ref: claude/browser-ui-merge-reconcile-2kwygj
          token: ${{ secrets.SRC_PAT }}
          fetch-depth: 0

      - name: Extract Sadhunam history and publish canonical repo
        shell: bash
        env:
          SRC_PAT: ${{ secrets.SRC_PAT }}
          EXPECTED_TARGET_HEAD: 5a8bb726dbc5ec9fe3d5be2ad512b195af385a97
        run: |
          set -euo pipefail
          test -n "$SRC_PAT" || { echo 'SRC_PAT is required'; exit 1; }
          git subtree split --prefix=sadhunam -b sadhunam-export
          git remote add canonical "https://x-access-token:${SRC_PAT}@github.com/vdeshmukh203/Sadhunam.git"
          git push --force-with-lease="refs/heads/main:${EXPECTED_TARGET_HEAD}" canonical sadhunam-export:main
