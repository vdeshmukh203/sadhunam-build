name: private-build

# Builds Sadhunam.App.exe from an ENCRYPTED source blob, so the public repo never
# contains readable source. The decryption key lives only in the Actions secret
# SRC_KEY (which staying-public does NOT expose), is injected at runtime, and is
# auto-redacted from these public logs. The built exe is re-encrypted before upload,
# so even the artifact is ciphertext. You decrypt it locally with the same key.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt source
        shell: bash
        env:
          SRC_KEY: ${{ secrets.SRC_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass env:SRC_KEY -in source.enc -out src.zip

      - name: Unpack source
        shell: pwsh
        run: Expand-Archive -Path src.zip -DestinationPath app -Force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained exe
        run: >
          dotnet publish app/src/Sadhunam.App/Sadhunam.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
