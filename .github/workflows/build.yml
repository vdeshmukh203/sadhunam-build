name: private-build

# Builds Sadhunam.App (WinUI 3, Windows-only) on a free GitHub-hosted windows-latest runner and
# publishes the result as ciphertext.
#
# Why this repo is public: Actions on the private repo are quota-blocked on hosted runners, and its
# self-hosted fallback cannot hold a bulk HTTPS transfer -- it has died fetching a 1MB action zip,
# spent 39 minutes failing a NuGet restore, and dropped a run at exactly ten minutes with no logs.
# A public repo gets free unlimited hosted minutes, which is the only dependable way to build this.
#
# Secrets, and they are NOT interchangeable:
#   SRC_PAT - a GitHub token with read access to the private repo. Lets the runner check out current
#             source. This is the intended mode; without it the build is only as fresh as source.enc.
#   SRC_KEY - base64. Encrypts the published build (and decrypts source.enc on the fallback path).
#
# SECURITY: there is deliberately no pull_request trigger. GitHub withholds secrets from workflows
# triggered by fork pull requests, and pull_request_target would defeat that protection, so neither
# is used. Only workflow_dispatch and pushes to main run this, both of which need write access here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA of the private repo to build'
        required: false
        default: 'claude/browser-ui-merge-reconcile-2kwygj'
  push:
    branches: [ main, master ]
  schedule:
    # Daily, so drift between the private repo and the last published build is bounded even if
    # nobody triggers anything. A build that produces an identical exe costs two minutes.
    - cron: '0 4 * * *'

permissions:
  contents: write   # required to publish the rolling release

concurrency:
  group: private-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_REPO: vdeshmukh203/claude-plans
  SRC_REF: ${{ inputs.ref || 'claude/browser-ui-merge-reconcile-2kwygj' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Check the configuration before spending any time on it. The two secret names are similar
      # enough to be swapped, and when that happens the symptom appears far from the cause.
      - name: Preflight - validate secrets
        id: mode
        shell: pwsh
        env:
          SRC_PAT: ${{ secrets.SRC_PAT }}
          SRC_KEY: ${{ secrets.SRC_KEY }}
        run: |
          $problems = @()

          # SRC_KEY must be base64. A GitHub token is the specific wrong value worth naming, because
          # storing the PAT under SRC_KEY is the mistake the naming invites.
          $keyOk = $false
          if (-not $env:SRC_KEY) {
            Write-Host "::warning::SRC_KEY is not set - the build will be published UNENCRYPTED."
          } elseif ($env:SRC_KEY -match '^(gh[pousr]_|github_pat_)') {
            $problems += "SRC_KEY holds a GitHub token. That belongs in SRC_PAT. SRC_KEY must be a base64 encryption key."
          } else {
            try { [Convert]::FromBase64String($env:SRC_KEY) | Out-Null; $keyOk = $true }
            catch { $problems += "SRC_KEY is not valid base64 ($($_.Exception.Message.Split('.')[0]))." }
          }

          $mode = ''
          if ($env:SRC_PAT) {
            if ($env:SRC_PAT -notmatch '^(gh[pousr]_|github_pat_)') {
              Write-Host "::warning::SRC_PAT does not look like a GitHub token. If the checkout 404s, this is why."
            }
            $mode = 'live'
            Write-Host "source: private repo $env:SRC_REPO @ $env:SRC_REF (live checkout)"
          } elseif (Test-Path source.enc) {
            $mode = 'blob'
            Write-Host "::warning::SRC_PAT is not set. Falling back to the committed source.enc, which is only as fresh as its last manual refresh. Add a secret named exactly SRC_PAT (a token with read access to $env:SRC_REPO) to build current source."
            if (-not $keyOk) {
              $problems += "The fallback path needs SRC_KEY to decrypt source.enc, and SRC_KEY is unusable."
            }
          } else {
            $problems += "No source available: SRC_PAT is unset and source.enc is missing."
          }

          if ($problems.Count -gt 0) {
            Write-Host "::error::Configuration problems:"
            $problems | ForEach-Object { Write-Host "::error::  - $_" }
            Write-Host ""
            Write-Host "Secrets live at Settings > Secrets and variables > Actions:"
            Write-Host "  SRC_PAT = GitHub token with read access to $env:SRC_REPO   (classic: 'repo' scope)"
            Write-Host "  SRC_KEY = base64 string used to encrypt the published build"
            throw "preflight failed - see above"
          }

          "mode=$mode" | Add-Content $env:GITHUB_OUTPUT
          "key_ok=$keyOk" | Add-Content $env:GITHUB_OUTPUT

      # --- live path -------------------------------------------------------------------------
      - name: Check out the private source
        if: steps.mode.outputs.mode == 'live'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_PAT }}
          path: private
          fetch-depth: 1

      - name: Lay the source out where the build expects it
        if: steps.mode.outputs.mode == 'live'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A token without repo scope can produce an empty checkout rather than an error, so this is
          # checked here instead of surfacing later as a missing csproj.
          if (-not (Test-Path private/sadhunam/src)) {
            throw "private/sadhunam/src is missing after checkout. SRC_PAT most likely lacks read access to $env:SRC_REPO (a classic token needs the 'repo' scope), or the ref '$env:SRC_REF' does not exist."
          }
          New-Item -ItemType Directory -Path app -Force | Out-Null
          Copy-Item private/sadhunam/src -Destination app/src -Recurse -Force
          if (Test-Path private/sadhunam/tests) {
            Copy-Item private/sadhunam/tests -Destination app/tests -Recurse -Force
          }
          Write-Host "built from $env:SRC_REPO @ $(git -C private rev-parse --short HEAD)"

      # --- fallback path ---------------------------------------------------------------------
      # SRC_KEY is used verbatim when it decodes to a legal AES key length (16/24/32 bytes); anything
      # else is treated as a passphrase and SHA-256'd into 32 bytes. Publish-EncryptedSource.ps1 in
      # the private repo applies the identical rule when producing the blob.
      - name: Decrypt and unpack source.enc
        if: steps.mode.outputs.mode == 'blob'
        shell: pwsh
        env:
          SRC_KEY: ${{ secrets.SRC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = [Convert]::FromBase64String($env:SRC_KEY)
          if ($raw.Length -in 16, 24, 32) {
            $key = $raw; Write-Host "key: $($raw.Length) bytes, used directly"
          } else {
            $key = [Security.Cryptography.SHA256]::Create().ComputeHash($raw)
            Write-Host "key: $($raw.Length) bytes is not an AES length, derived 32 via SHA-256"
          }

          $blob = [IO.File]::ReadAllBytes("source.enc")
          if ($blob.Length -le 16) { throw "source.enc is $($blob.Length) bytes - too small to hold an IV and any ciphertext." }
          if (($blob.Length - 16) % 16 -ne 0) { throw "source.enc is not a whole number of AES blocks after the 16-byte IV - truncated, or not CBC ciphertext." }

          $iv = New-Object byte[] 16
          $ct = New-Object byte[] ($blob.Length - 16)
          [Array]::Copy($blob, 0, $iv, 0, 16)
          [Array]::Copy($blob, 16, $ct, 0, $ct.Length)
          $aes = [Security.Cryptography.Aes]::Create(); $aes.Key = $key; $aes.IV = $iv
          try {
            $pt = $aes.CreateDecryptor().TransformFinalBlock($ct, 0, $ct.Length)
          } catch {
            throw "Decrypt failed, which almost always means SRC_KEY does not match the key source.enc was encrypted with - the padding check fails first. ($($_.Exception.Message))"
          }
          if ($pt[0] -ne 0x50 -or $pt[1] -ne 0x4B) { throw "Decrypted output is not a zip - SRC_KEY is probably wrong." }

          [IO.File]::WriteAllBytes("src.zip", $pt)
          Expand-Archive -Path src.zip -DestinationPath app -Force

      # --- from here both paths are identical -------------------------------------------------
      - name: Validate the source tree before building
        shell: pwsh
        run: |
          $proj = "app/src/Sadhunam.App/Sadhunam.App.csproj"
          if (-not (Test-Path $proj)) {
            Get-ChildItem app -Recurse -Depth 2 | Select-Object -First 40 FullName | Out-Host
            throw "$proj is missing - the source landed in an unexpected layout (listing above)."
          }
          $count = (Get-ChildItem app -Recurse -File -Filter *.cs).Count
          Write-Host "source: $count .cs files"
          if ($count -lt 50) { throw "Only $count .cs files - the source tree looks truncated." }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore separately, with retries: it is the only network-bound step, and a transient NuGet
      # failure should not cost the whole run. -r win-x64 keeps win-x86 and win-arm64 runtime packs
      # out of the graph, roughly a third of the download.
      - name: Restore (win-x64, with retries)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($i = 1; $i -le 4; $i++) {
            dotnet restore app/src/Sadhunam.App/Sadhunam.App.csproj -r win-x64
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::restore attempt $i failed with $LASTEXITCODE"
            Start-Sleep -Seconds (10 * $i)
          }
          throw "restore failed after 4 attempts"

      # Gate the build on the cross-platform suite. It used to run in the private repo, on a
      # self-hosted runner that could not be relied on to reach the test step; here it runs on the
      # same free runner as the build, so a red suite actually stops a release.
      #
      # Absent tests warn and continue rather than fail: this workflow's job is to produce a build,
      # and refusing to when a directory is missing trades a working release for a stricter-looking
      # one.
      - name: Test Sadhunam.Core
        shell: pwsh
        run: |
          $proj = "app/tests/Sadhunam.Core.Tests"
          if (-not (Test-Path $proj)) {
            Write-Host "::warning::$proj is absent - publishing without a test gate."
            exit 0
          }
          dotnet test $proj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Core suite failed - not publishing this build." }

      - name: Build self-contained exe
        run: >
          dotnet publish app/src/Sadhunam.App/Sadhunam.App.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:TreatWarningsAsErrors=false -p:NuGetAudit=false
          -o out

      - name: Verify the build produced a runnable app
        shell: pwsh
        run: |
          $exe = "out/Sadhunam.App.exe"
          if (-not (Test-Path $exe)) { throw "publish reported success but $exe does not exist." }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $files = (Get-ChildItem out -Recurse -File).Count
          Write-Host "built: $exe ($mb MB), $files files in out/"
          if ($files -lt 50) { throw "out/ holds only $files files - this is not a self-contained publish." }
          if (-not (Test-Path "out/Microsoft.WindowsAppRuntime.Bootstrap.dll")) {
            Write-Host "::warning::WindowsAppRuntime bootstrap missing from out/ - the app may not start without the App SDK installed."
          }

      - name: Package and encrypt the build
        shell: pwsh
        env:
          SRC_KEY: ${{ secrets.SRC_KEY }}
          KEY_OK: ${{ steps.mode.outputs.key_ok }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path out/* -DestinationPath app.zip -Force

          if ($env:KEY_OK -ne 'True') {
            Write-Host "::warning::No usable SRC_KEY - publishing the build UNENCRYPTED."
            Copy-Item app.zip app.enc -Force
            "encrypted=false" | Add-Content $env:GITHUB_ENV
            return
          }

          $raw = [Convert]::FromBase64String($env:SRC_KEY)
          $key = if ($raw.Length -in 16, 24, 32) { $raw }
                 else { [Security.Cryptography.SHA256]::Create().ComputeHash($raw) }
          $pt  = [IO.File]::ReadAllBytes("app.zip")
          $aes = [Security.Cryptography.Aes]::Create(); $aes.Key = $key; $aes.GenerateIV()
          $ct  = $aes.CreateEncryptor().TransformFinalBlock($pt, 0, $pt.Length)
          $blob = New-Object byte[] (16 + $ct.Length)
          [Array]::Copy($aes.IV, 0, $blob, 0, 16)
          [Array]::Copy($ct, 0, $blob, 16, $ct.Length)
          [IO.File]::WriteAllBytes("app.enc", $blob)

          # Verify the ciphertext opens before publishing it. Shipping a blob nobody can decrypt is
          # worse than failing here, because only the person trying to use it would find out.
          $iv2 = New-Object byte[] 16
          $ct2 = New-Object byte[] ($blob.Length - 16)
          [Array]::Copy($blob, 0, $iv2, 0, 16)
          [Array]::Copy($blob, 16, $ct2, 0, $ct2.Length)
          $aes2 = [Security.Cryptography.Aes]::Create(); $aes2.Key = $key; $aes2.IV = $iv2
          $back = $aes2.CreateDecryptor().TransformFinalBlock($ct2, 0, $ct2.Length)
          if ($back.Length -ne $pt.Length) { throw "round-trip check failed: $($back.Length) vs $($pt.Length) bytes" }

          Write-Host "app.enc: $([math]::Round($blob.Length / 1MB, 2)) MB, verified decryptable"
          "encrypted=true" | Add-Content $env:GITHUB_ENV

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sadhunam-app-encrypted
          path: app.enc
          retention-days: 7

      # A stable URL that does not expire and needs no login. Ciphertext, so nothing readable is
      # made public.
      - name: Publish to rolling "latest" release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api  = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $auth = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }

          $state = if ($env:encrypted -eq 'true') {
            "``app.enc`` is AES-CBC ciphertext with the IV as the first 16 bytes, opened with SRC_KEY."
          } else {
            "WARNING: no usable SRC_KEY, so ``app.enc`` is a PLAIN zip despite the name."
          }

          $notes = @"
          Sadhunam.App - self-contained win-x64, built on windows-latest.

          Built $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC from ``$env:SRC_REPO`` @ ``$env:SRC_REF``,
          after the Sadhunam.Core suite passed.
          $state
          "@

          function Invoke-WithRetry([scriptblock]$op, [string]$what) {
            for ($i = 1; $i -le 3; $i++) {
              try { return & $op } catch {
                if ($i -eq 3) { throw "$what failed after 3 attempts: $($_.Exception.Message)" }
                Write-Host "::warning::$what attempt $i failed, retrying"
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }

          try {
            $rel = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $auth -Body (@{
              tag_name = 'latest'; name = 'Sadhunam app (latest build)'
              body = $notes; target_commitish = $env:GITHUB_SHA
            } | ConvertTo-Json)
          } catch {
            $rel = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/latest" -Headers $auth
            Invoke-RestMethod -Method Patch -Uri "$api/releases/$($rel.id)" -Headers $auth `
              -Body (@{ body = $notes } | ConvertTo-Json) | Out-Null
          }

          foreach ($a in $rel.assets) {
            if ($a.name -eq 'app.enc') {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($a.id)" -Headers $auth
            }
          }

          Invoke-WithRetry {
            Invoke-RestMethod -Method Post -Headers $auth -ContentType 'application/octet-stream' `
              -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)/assets?name=app.enc" `
              -InFile 'app.enc' | Out-Null
          } "asset upload"

          # Read it back: an upload that reports success but stores nothing is a real failure mode,
          # and asking for the asset again is the only way to know.
          $check = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/latest" -Headers $auth
          $asset = $check.assets | Where-Object { $_.name -eq 'app.enc' }
          $local = (Get-Item app.enc).Length
          if (-not $asset)                 { throw "app.enc is not on the release after upload." }
          if ($asset.size -ne $local)      { throw "published asset is $($asset.size) bytes, expected $local." }
          if ($asset.state -ne 'uploaded') { throw "published asset state is '$($asset.state)', expected 'uploaded'." }

          Write-Host "verified: app.enc $($asset.size) bytes -> $($check.html_url)"

      # A second copy, in plaintext, on the private source repo — vdeshmukh203/claude-plans, the
      # same repo the source is checked out of above, and nowhere else.
      #
      # The public release has to be ciphertext because anyone can read it, which leaves the owner
      # decrypting their own build by hand every time. claude-plans is private, so the same zip can
      # live there as-is and be downloaded and run with no extra step. One artifact, published
      # twice, because the two repositories have opposite audiences.
      #
      # This needs SRC_PAT to carry WRITE access. Read is enough for the source checkout, so a token
      # that has always worked can fail here — and the failure says exactly that rather than leaving
      # a bare 403 to be interpreted.
      #
      # It runs after the public release is already published, so a failure here costs the private
      # copy and nothing else. It still fails the job: a run ending green having published half of
      # what it was asked to would be the same defect this workflow guards against everywhere else,
      # a state reported as success when it is not one.
      - name: Publish the plain build to the private repo
        if: steps.mode.outputs.mode == 'live'
        shell: pwsh
        env:
          SRC_PAT: ${{ secrets.SRC_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api  = "https://api.github.com/repos/$env:SRC_REPO"
          $auth = @{ Authorization = "Bearer $env:SRC_PAT"; Accept = "application/vnd.github+json" }
          $tag  = 'app-latest'

          $notes = @"
          Sadhunam.App - self-contained win-x64, plaintext.

          Built $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC on a hosted windows-latest runner from
          ``$env:SRC_REF``, after the Sadhunam.Core suite passed. Unzip and run ``Sadhunam.App.exe``.

          The same build the public repo publishes as ``app.enc``; here it needs no decryption,
          because this repository is private.
          "@

          # GitHub answers 403 for two unrelated things: "this token may not do that" and "you are
          # going too fast". They need opposite responses -- regenerate a credential, or wait -- so
          # they must never arrive as one message. This step used to call every 403 a permissions
          # failure and tell the reader to widen the token's scope, which on a rate limit sends them
          # to fix a credential that was never broken. It is not hypothetical: on 2026-07-29 the
          # private publish succeeded at 12:26 and returned 403 at 12:31 with the same secret, after
          # four builds in twenty minutes each uploading ~74MB twice.
          function Test-RateLimited($err) {
            if ("$($err.ErrorDetails.Message)" -match 'rate limit') { return $true }
            try {
              $remaining = $err.Exception.Response.Headers.GetValues('x-ratelimit-remaining')
              return ($remaining -and [int]($remaining | Select-Object -First 1) -eq 0)
            } catch { return $false }
          }

          # Reused rather than re-created. A release per build turns the sidebar into a list of
          # entries that all mean "the current build", and the download URL stops being stable.
          try {
            $rel = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $auth -Body (@{
              tag_name = $tag; name = 'Sadhunam app (current build, plaintext)'; body = $notes
            } | ConvertTo-Json)
            Write-Host "created $tag on $env:SRC_REPO"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            if ($code -eq 403 -and (Test-RateLimited $_)) {
              Write-Host "::error::GitHub rate-limited the release API on $env:SRC_REPO (HTTP 403). This is NOT a token problem - SRC_PAT's scopes are fine and nothing needs regenerating. Re-run this build, and space consecutive builds further apart."
              throw "rate limited publishing to $env:SRC_REPO - re-run, do not touch the token"
            }
            if ($code -eq 403 -or $code -eq 404) {
              Write-Host "::error::SRC_PAT cannot write releases on $env:SRC_REPO (HTTP $code). The source checkout only needs read, so a token that works for that can still fail here. Give SRC_PAT 'repo' scope (classic), or Contents: read and write (fine-grained) on $env:SRC_REPO. If this same step succeeded on an earlier run today with the same secret, suspect a rate limit and re-run before changing anything."
              throw "SRC_PAT lacks write access to $env:SRC_REPO"
            }
            $rel = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $auth
            Invoke-RestMethod -Method Patch -Uri "$api/releases/$($rel.id)" -Headers $auth `
              -Body (@{ body = $notes } | ConvertTo-Json) | Out-Null
            Write-Host "reused $tag on $env:SRC_REPO"
          }

          foreach ($a in $rel.assets) {
            if ($a.name -eq 'app.zip') {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($a.id)" -Headers $auth
            }
          }

          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-RestMethod -Method Post -Headers $auth -ContentType 'application/octet-stream' `
                -Uri "https://uploads.github.com/repos/$env:SRC_REPO/releases/$($rel.id)/assets?name=app.zip" `
                -InFile 'app.zip' | Out-Null
              break
            } catch {
              if ($i -eq 3) { throw "asset upload failed after 3 attempts: $($_.Exception.Message)" }
              Write-Host "::warning::upload attempt $i failed, retrying"
              Start-Sleep -Seconds (5 * $i)
            }
          }

          # Read back, for the same reason the public publish does: an upload can report success and
          # store nothing, and only asking for the asset again tells the two apart.
          $check = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $auth
          $asset = $check.assets | Where-Object { $_.name -eq 'app.zip' }
          $local = (Get-Item app.zip).Length
          if (-not $asset)                 { throw "app.zip is not on the private release after upload." }
          if ($asset.size -ne $local)      { throw "published asset is $($asset.size) bytes, expected $local." }
          if ($asset.state -ne 'uploaded') { throw "published asset state is '$($asset.state)', expected 'uploaded'." }

          Write-Host "verified: app.zip $($asset.size) bytes -> $($check.html_url)"
